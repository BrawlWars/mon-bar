<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon bar">
<meta name="theme-color" content="#17141C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Mon bar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #17141C; color: #EDE6DA; font-family: Georgia, 'Times New Roman', serif; }
  .ui { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 50px); }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #C9A050; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 400; margin: 0 0 6px; line-height: 1.15; }
  .sub { font-size: 13px; color: #9C93A8; margin: 0 0 22px; }
  .reset-btn { font-size: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid #3A3346; background: transparent; color: #B8AFC7; cursor: pointer; white-space: nowrap; }
  .reset-btn:active { background: #211C2B; }
  .fav-section { margin-bottom: 26px; }
  .fav-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .fav-chip { flex-shrink: 0; border: 1px solid #4A3F2A; background: rgba(201,160,80,0.08); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-width: 120px; }
  .fav-chip .fname { font-size: 13px; color: #EDE6DA; margin: 0 0 3px; white-space: nowrap; }
  .fav-chip .fstars { font-size: 11px; color: #C9A050; }
  .cat-label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #9C93A8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { font-size: 13px; padding: 8px 13px; border-radius: 999px; border: 1px solid #3A3346; background: transparent; color: #B8AFC7; cursor: pointer; }
  .chip.on { border-color: #C9A050; background: rgba(201,160,80,0.15); color: #E8C77A; }
  .divider { height: 1px; background: #2A2433; margin: 4px 0 24px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  #search { flex: 1; min-width: 140px; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; outline: none; }
  .filter-lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9C93A8; white-space: nowrap; }
  select { font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; }
  .toolbar2 { display: flex; gap: 8px; margin-bottom: 18px; }
  .toolbar2 select { flex: 1; }
  .card { border: 1px solid #2A2433; background: #1D1926; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .card.ready { border-color: #4A3F2A; background: rgba(201,160,80,0.06); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 17px; font-weight: 400; }
  .status { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #6E647F; white-space: nowrap; }
  .status.ready { color: #E8C77A; }
  .tag-row { display: flex; gap: 6px; margin: 6px 0 10px; }
  .tag { font-size: 10px; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 999px; background: #241F2E; color: #8D839E; }
  .ing-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .ing-list li { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #B8AFC7; border-bottom: 1px solid #241F2E; }
  .ing-list li:last-child { border-bottom: none; }
  .ing-name { display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A050; flex-shrink: 0; }
  .dot.off { background: #4A4155; }
  .ing-qty { color: #8D839E; }
  .steps { font-size: 13px; color: #B8AFC7; margin: 0 0 10px; line-height: 1.5; }
  .stars { display: flex; gap: 4px; }
  .stars button { background: none; border: none; padding: 3px; cursor: pointer; font-size: 15px; }
  .shared-rating { font-size: 12px; color: #8D839E; margin-top: 6px; }
  .empty { text-align: center; color: #6E647F; font-size: 13px; padding: 30px 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #1D1926; border-radius: 20px 20px 0 0; padding: 24px 22px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .sheet-top h2 { margin: 0; font-size: 22px; font-weight: 400; }
  .close-btn { background: none; border: none; color: #8D839E; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .share-btn { font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid #3A3346; background: transparent; color: #E8C77A; cursor: pointer; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2E2740; color: #EDE6DA; font-size: 13px; padding: 10px 16px; border-radius: 8px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap ui">
  <div class="head-row">
    <div>
      <div class="eyebrow">Mon bar</div>
      <h1 class="voice">Ce que vous pouvez servir ce soir</h1>
    </div>
    <button class="reset-btn" id="reset-btn">Réinitialiser</button>
  </div>
  <p class="sub" id="count-line"></p>

  <div class="fav-section" id="fav-section" style="display:none">
    <div class="cat-label">Vos favoris</div>
    <div class="fav-scroll" id="fav-scroll"></div>
  </div>

  <div id="categories"></div>

  <div class="divider"></div>

  <div class="toolbar">
    <input id="search" placeholder="Chercher un cocktail">
    <label class="filter-lbl"><input type="checkbox" id="only-makeable"> Réalisables</label>
  </div>
  <div class="toolbar2">
    <select id="filter-category"></select>
    <select id="filter-base"></select>
  </div>

  <div id="list"></div>
</div>

<div class="overlay ui" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast ui" id="toast"></div>

<script type="module">
const CATEGORIES = [
  { name: "Spiritueux", items: ["Vodka","Gin","Rhum blanc","Rhum ambré","Tequila","Whisky","Cognac","Pastis"] },
  { name: "Liqueurs & vins", items: ["Triple sec","Vermouth rouge","Vermouth sec","Amaretto","Crème de menthe","Champagne / prosecco","Vin blanc sec","Campari","Aperol","Crème de cassis","Kahlua","Baileys"] },
  { name: "Mixers & jus", items: ["Jus de citron","Jus de citron vert","Jus d'orange","Jus de cranberry","Jus de pamplemousse","Jus d'ananas","Crème de coco","Soda / eau gazeuse","Tonic","Ginger beer","Sirop de sucre","Sirop de grenadine","Angostura bitters","Menthe fraîche","Coca","Lait / crème liquide"] }
];

function ing(name, qty) { return { name, qty }; }
function c(name, glass, base, category, ingredients, steps) { return { name, glass, base, category, ingredients, steps }; }

const COCKTAILS = [
  c("Mojito","Verre long","Rhum blanc","Classique",[ing("Rhum blanc","6 cl"),ing("Jus de citron vert","3 cl"),ing("Sirop de sucre","2 cl"),ing("Menthe fraîche","8 feuilles"),ing("Soda / eau gazeuse","4 cl")],"Piler la menthe avec le sucre et le citron vert, ajouter le rhum, glace pilée, compléter au soda."),
  c("Daiquiri","Verre à cocktail","Rhum blanc","Classique",[ing("Rhum blanc","6 cl"),ing("Jus de citron vert","2,5 cl"),ing("Sirop de sucre","1,5 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Gin Tonic","Verre ballon","Gin","Apéritif",[ing("Gin","5 cl"),ing("Tonic","15 cl")],"Verser le gin sur glaçons, compléter au tonic, garnir d'un zeste."),
  c("Whisky Sour","Verre old fashioned","Whisky","Classique",[ing("Whisky","6 cl"),ing("Jus de citron","3 cl"),ing("Sirop de sucre","1,5 cl")],"Shaker avec glace, filtrer sur glaçons frais."),
  c("Margarita","Verre à cocktail","Tequila","Classique",[ing("Tequila","5 cl"),ing("Triple sec","2 cl"),ing("Jus de citron vert","2 cl")],"Shaker avec glace, servir dans un verre au bord salé."),
  c("Cosmopolitan","Verre à cocktail","Vodka","Classique",[ing("Vodka","4 cl"),ing("Triple sec","1,5 cl"),ing("Jus de citron vert","1,5 cl"),ing("Jus de cranberry","3 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Moscow Mule","Mug en cuivre","Vodka","Classique",[ing("Vodka","5 cl"),ing("Jus de citron vert","1,5 cl"),ing("Ginger beer","10 cl")],"Verser sur glace, compléter au ginger beer, garnir de citron vert."),
  c("Screwdriver","Verre long","Vodka","Classique",[ing("Vodka","5 cl"),ing("Jus d'orange","10 cl")],"Verser sur glaçons, mélanger."),
  c("Cuba Libre","Verre long","Rhum ambré","Classique",[ing("Rhum ambré","5 cl"),ing("Coca","12 cl"),ing("Jus de citron vert","1 cl")],"Verser sur glace, compléter au coca, un trait de citron vert."),
  c("Old Fashioned","Verre old fashioned","Whisky","Classique",[ing("Whisky","6 cl"),ing("Sirop de sucre","1 cl"),ing("Angostura bitters","2 traits")],"Diluer le sucre avec les bitters, ajouter le whisky et un gros glaçon."),
  c("Negroni","Verre old fashioned","Gin","Apéritif",[ing("Gin","3 cl"),ing("Vermouth rouge","3 cl"),ing("Campari","3 cl")],"Verser à parts égales sur glace, mélanger, zeste d'orange."),
  c("Americano","Verre old fashioned","Campari","Apéritif",[ing("Campari","3 cl"),ing("Vermouth rouge","3 cl"),ing("Soda / eau gazeuse","6 cl")],"Verser sur glace, compléter au soda, zeste d'orange."),
  c("Boulevardier","Verre old fashioned","Whisky","Digestif",[ing("Whisky","3 cl"),ing("Campari","3 cl"),ing("Vermouth rouge","3 cl")],"Mélanger avec glace, filtrer sur un gros glaçon, zeste d'orange."),
  c("Tequila Sunrise","Verre long","Tequila","Classique",[ing("Tequila","5 cl"),ing("Jus d'orange","10 cl"),ing("Sirop de grenadine","1,5 cl")],"Verser tequila et jus d'orange sur glace, faire couler la grenadine au fond sans mélanger."),
  c("Amaretto Sour","Verre old fashioned","Amaretto","Classique",[ing("Amaretto","5 cl"),ing("Jus de citron","3 cl"),ing("Sirop de sucre","1 cl")],"Shaker avec glace, filtrer sur glaçons frais."),
  c("French 75","Flûte","Gin","Apéritif",[ing("Gin","3 cl"),ing("Jus de citron","1,5 cl"),ing("Sirop de sucre","1 cl"),ing("Champagne / prosecco","6 cl")],"Shaker gin, citron, sucre avec glace, filtrer en flûte, compléter au champagne."),
  c("Kir Royal","Flûte","Vin / champagne","Apéritif",[ing("Crème de cassis","1,5 cl"),ing("Champagne / prosecco","12 cl")],"Verser la crème de cassis puis compléter au champagne, sans mélanger."),
  c("Kir","Verre à vin","Vin / champagne","Apéritif",[ing("Crème de cassis","1,5 cl"),ing("Vin blanc sec","10 cl")],"Verser la crème de cassis puis compléter au vin blanc."),
  c("Aperol Spritz","Verre ballon","Aperol","Apéritif",[ing("Aperol","6 cl"),ing("Champagne / prosecco","9 cl"),ing("Soda / eau gazeuse","3 cl")],"Verser sur glaçons dans l'ordre : prosecco, Aperol, soda. Garnir d'une rondelle d'orange."),
  c("Grasshopper","Verre à cocktail","Crème de menthe","Digestif",[ing("Crème de menthe","3 cl"),ing("Amaretto","3 cl"),ing("Lait / crème liquide","3 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Dark 'n' Stormy","Verre long","Rhum ambré","Classique",[ing("Rhum ambré","5 cl"),ing("Ginger beer","12 cl"),ing("Jus de citron vert","1 cl")],"Verser le rhum sur glace, compléter au ginger beer, un trait de citron vert."),
  c("Vodka Cranberry","Verre long","Vodka","Classique",[ing("Vodka","5 cl"),ing("Jus de cranberry","12 cl")],"Verser sur glaçons, mélanger, garnir de citron vert."),
  c("Sidecar","Verre à cocktail","Cognac","Digestif",[ing("Cognac","4 cl"),ing("Triple sec","2 cl"),ing("Jus de citron","2 cl")],"Shaker avec glace, filtrer dans un verre au bord sucré."),
  c("White Russian","Verre old fashioned","Vodka","Digestif",[ing("Vodka","5 cl"),ing("Kahlua","2 cl"),ing("Lait / crème liquide","3 cl")],"Verser vodka et Kahlua sur glace, ajouter la crème délicatement en dernier."),
  c("Black Russian","Verre old fashioned","Vodka","Digestif",[ing("Vodka","5 cl"),ing("Kahlua","2 cl")],"Verser sur glaçons, mélanger."),
  c("Mudslide","Verre old fashioned","Vodka","Digestif",[ing("Vodka","3 cl"),ing("Kahlua","3 cl"),ing("Baileys","3 cl"),ing("Lait / crème liquide","3 cl")],"Shaker avec glace, verser sur glaçons."),
  c("B-52","Verre à shot","Kahlua","Digestif",[ing("Kahlua","2 cl"),ing("Baileys","2 cl"),ing("Triple sec","2 cl")],"Verser délicatement en couches successives, du plus dense au moins dense, à l'aide d'une cuillère à dos rond."),
  c("Godfather","Verre old fashioned","Whisky","Digestif",[ing("Whisky","4,5 cl"),ing("Amaretto","1,5 cl")],"Verser sur glaçons, mélanger."),
  c("Godmother","Verre old fashioned","Vodka","Digestif",[ing("Vodka","4,5 cl"),ing("Amaretto","1,5 cl")],"Verser sur glaçons, mélanger."),
  c("Kamikaze","Verre à shot / cocktail","Vodka","Classique",[ing("Vodka","3 cl"),ing("Triple sec","3 cl"),ing("Jus de citron vert","3 cl")],"Shaker avec glace, filtrer."),
  c("Between the Sheets","Verre à cocktail","Multi","Digestif",[ing("Cognac","2 cl"),ing("Rhum blanc","2 cl"),ing("Triple sec","2 cl"),ing("Jus de citron","2 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Long Island Iced Tea","Verre long","Multi","Classique",[ing("Vodka","1,5 cl"),ing("Gin","1,5 cl"),ing("Rhum blanc","1,5 cl"),ing("Tequila","1,5 cl"),ing("Triple sec","1,5 cl"),ing("Jus de citron","2,5 cl"),ing("Sirop de sucre","1,5 cl"),ing("Coca","3 cl")],"Verser tous les alcools et le citron sur glace, mélanger, compléter au coca."),
  c("Greyhound","Verre long","Vodka","Apéritif",[ing("Vodka","5 cl"),ing("Jus de pamplemousse","10 cl")],"Verser sur glaçons, mélanger."),
  c("Salty Dog","Verre long","Gin","Apéritif",[ing("Gin","5 cl"),ing("Jus de pamplemousse","10 cl")],"Verre au bord salé, verser sur glaçons, mélanger."),
  c("Paloma","Verre long","Tequila","Apéritif",[ing("Tequila","5 cl"),ing("Jus de pamplemousse","8 cl"),ing("Jus de citron vert","1 cl"),ing("Soda / eau gazeuse","4 cl")],"Verser sur glace, compléter au soda, verre au bord salé en option."),
  c("Sea Breeze","Verre long","Vodka","Classique",[ing("Vodka","5 cl"),ing("Jus de cranberry","8 cl"),ing("Jus de pamplemousse","4 cl")],"Verser sur glaçons, mélanger."),
  c("Piña Colada","Verre long / hurricane","Rhum blanc","Classique",[ing("Rhum blanc","5 cl"),ing("Jus d'ananas","9 cl"),ing("Crème de coco","3 cl")],"Mixer ou shaker vigoureusement avec glace, servir bien frais."),
  c("Mimosa","Flûte","Vin / champagne","Apéritif",[ing("Champagne / prosecco","7,5 cl"),ing("Jus d'orange","7,5 cl")],"Verser à parts égales dans une flûte, sans mélanger."),
  c("Champagne Cocktail","Flûte","Vin / champagne","Apéritif",[ing("Champagne / prosecco","12 cl"),ing("Angostura bitters","2 traits"),ing("Sirop de sucre","0,5 cl")],"Imbiber le sucre de bitters au fond de la flûte, compléter au champagne."),
  c("Manhattan","Verre à cocktail","Whisky","Digestif",[ing("Whisky","6 cl"),ing("Vermouth rouge","3 cl"),ing("Angostura bitters","2 traits")],"Mélanger avec glace, filtrer dans un verre glacé, cerise en garniture."),
  c("Bronx","Verre à cocktail","Gin","Classique",[ing("Gin","4 cl"),ing("Vermouth rouge","1,5 cl"),ing("Vermouth sec","1,5 cl"),ing("Jus d'orange","1,5 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Gimlet","Verre à cocktail","Gin","Classique",[ing("Gin","5 cl"),ing("Jus de citron vert","2 cl"),ing("Sirop de sucre","1 cl")],"Shaker avec glace, filtrer dans un verre glacé."),
  c("Tom Collins","Verre long","Gin","Classique",[ing("Gin","4,5 cl"),ing("Jus de citron","3 cl"),ing("Sirop de sucre","1,5 cl"),ing("Soda / eau gazeuse","6 cl")],"Shaker gin, citron, sucre avec glace, verser sur glaçons, compléter au soda."),
  c("Pastis","Verre long","Pastis","Apéritif",[ing("Pastis","3 cl")],"Verser le pastis, ajouter environ 5 volumes d'eau fraîche et des glaçons."),
  c("Virgin Mojito","Verre long","Sans alcool","Sans alcool",[ing("Jus de citron vert","3 cl"),ing("Sirop de sucre","2 cl"),ing("Menthe fraîche","8 feuilles"),ing("Soda / eau gazeuse","12 cl")],"Piler la menthe avec le sucre et le citron vert, glace pilée, compléter au soda."),
  c("Shirley Temple","Verre long","Sans alcool","Sans alcool",[ing("Ginger beer","12 cl"),ing("Sirop de grenadine","1,5 cl")],"Verser sur glace, mélanger doucement, garnir d'une cerise."),
  c("Virgin Piña Colada","Verre long / hurricane","Sans alcool","Sans alcool",[ing("Jus d'ananas","10 cl"),ing("Crème de coco","4 cl"),ing("Jus de citron vert","1 cl")],"Mixer ou shaker avec glace, servir bien frais."),
  c("Cranberry Fizz","Verre long","Sans alcool","Sans alcool",[ing("Jus de cranberry","8 cl"),ing("Soda / eau gazeuse","8 cl"),ing("Jus de citron vert","1 cl")],"Verser sur glaçons, mélanger."),
  c("Ginger Citron Fizz","Verre long","Sans alcool","Sans alcool",[ing("Ginger beer","12 cl"),ing("Jus de citron","2 cl"),ing("Sirop de sucre","1 cl")],"Verser sur glaçons, mélanger.")
];

const CATEGORY_OPTIONS = ["Tous","Apéritif","Classique","Digestif","Sans alcool"];
const BASE_OPTIONS = ["Tous", ...Array.from(new Set(COCKTAILS.map(x => x.base))).sort((a,b)=>a.localeCompare(b))];

const STAR_FULL = "★", STAR_EMPTY = "☆";
let owned = new Set(JSON.parse(localStorage.getItem("mon-bar-inventory") || "[]"));
let ratings = JSON.parse(localStorage.getItem("mon-bar-ratings") || "{}");
let sharedRatings = {};
let query = "";
let onlyMakeable = false;
let filterCategory = "Tous";
let filterBase = "Tous";

function save() {
  localStorage.setItem("mon-bar-inventory", JSON.stringify([...owned]));
  localStorage.setItem("mon-bar-ratings", JSON.stringify(ratings));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function renderCategories() {
  const el = document.getElementById("categories");
  el.innerHTML = CATEGORIES.map(cat => `
    <div class="cat-label">${cat.name}</div>
    <div class="chips">
      ${cat.items.map(item => `<button class="chip ${owned.has(item) ? "on" : ""}" data-item="${item}">${owned.has(item) ? "✓ " : ""}${item}</button>`).join("")}
    </div>
  `).join("");
  el.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = btn.dataset.item;
      owned.has(item) ? owned.delete(item) : owned.add(item);
      save();
      renderCategories();
      renderList();
      renderFavorites();
    });
  });
}

function scoredCocktails() {
  return COCKTAILS.map(x => {
    const missing = x.ingredients.filter(i => !owned.has(i.name));
    return { ...x, missing, makeable: missing.length === 0 };
  });
}

function filteredCocktails() {
  return scoredCocktails()
    .filter(x => onlyMakeable ? x.makeable : true)
    .filter(x => x.name.toLowerCase().includes(query.toLowerCase()))
    .filter(x => filterCategory === "Tous" ? true : x.category === filterCategory)
    .filter(x => filterBase === "Tous" ? true : x.base === filterBase)
    .sort((a, b) => a.missing.length - b.missing.length || a.name.localeCompare(b.name));
}

function renderFilters() {
  const catSel = document.getElementById("filter-category");
  const baseSel = document.getElementById("filter-base");
  catSel.innerHTML = CATEGORY_OPTIONS.map(o => `<option value="${o}">${o === "Tous" ? "Toutes catégories" : o}</option>`).join("");
  baseSel.innerHTML = BASE_OPTIONS.map(o => `<option value="${o}">${o === "Tous" ? "Toutes bases" : o}</option>`).join("");
  catSel.addEventListener("change", () => { filterCategory = catSel.value; renderList(); });
  baseSel.addEventListener("change", () => { filterBase = baseSel.value; renderList(); });
}

function renderFavorites() {
  const favs = scoredCocktails()
    .filter(x => (ratings[x.name] || 0) >= 4)
    .sort((a, b) => (ratings[b.name] || 0) - (ratings[a.name] || 0))
    .slice(0, 5);
  const section = document.getElementById("fav-section");
  if (favs.length === 0) { section.style.display = "none"; return; }
  section.style.display = "block";
  document.getElementById("fav-scroll").innerHTML = favs.map(x => `
    <div class="fav-chip" data-open="${x.name}">
      <p class="fname">${x.name}</p>
      <p class="fstars">${STAR_FULL.repeat(ratings[x.name] || 0)}${STAR_EMPTY.repeat(5 - (ratings[x.name] || 0))}</p>
    </div>
  `).join("");
  document.getElementById("fav-scroll").querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => openModal(el.dataset.open));
  });
}

function ingredientListHtml(x) {
  return x.ingredients.map(i => {
    const isMissing = !owned.has(i.name);
    return `<li class="${isMissing ? "miss" : ""}">
      <span class="ing-name"><span class="dot ${isMissing ? "off" : ""}"></span>${i.name}</span>
      <span class="ing-qty">${i.qty}</span>
    </li>`;
  }).join("");
}

function sharedRatingHtml(name) {
  const s = sharedRatings[name];
  if (!s || s.count === 0) return "";
  return `<div class="shared-rating">Note des amis : ${s.avg.toFixed(1)} ★ (${s.count} avis)</div>`;
}

function renderList() {
  const scored = filteredCocktails();
  const makeableCount = COCKTAILS.filter(x => x.ingredients.every(i => owned.has(i.name))).length;
  document.getElementById("count-line").textContent =
    `${makeableCount} cocktail${makeableCount !== 1 ? "s" : ""} réalisable${makeableCount !== 1 ? "s" : ""} sur ${COCKTAILS.length}, avec votre bar actuel`;

  const list = document.getElementById("list");
  if (scored.length === 0) {
    list.innerHTML = `<div class="empty">Aucun cocktail ne correspond.</div>`;
    return;
  }
  list.innerHTML = scored.map(x => {
    const r = ratings[x.name] || 0;
    return `
    <div class="card ${x.makeable ? "ready" : ""}" data-open="${x.name}">
      <div class="card-head">
        <h3 class="voice">${x.name}</h3>
        <span class="status ${x.makeable ? "ready" : ""}">${x.makeable ? "Prêt" : x.missing.length === 1 ? "1 ingrédient manquant" : x.missing.length + " ingrédients manquants"}</span>
      </div>
      <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.glass}</span></div>
      <ul class="ing-list">${ingredientListHtml(x)}</ul>
      <div class="steps">${x.steps}</div>
      <div class="stars" data-name="${x.name}">
        ${[1,2,3,4,5].map(n => `<button data-n="${n}">${n <= r ? STAR_FULL : STAR_EMPTY}</button>`).join("")}
      </div>
      ${sharedRatingHtml(x.name)}
    </div>`;
  }).join("");

  list.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.closest(".stars")) return;
      openModal(card.dataset.open);
    });
  });
  list.querySelectorAll(".stars").forEach(starsEl => {
    const name = starsEl.dataset.name;
    starsEl.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = parseInt(btn.dataset.n, 10);
        setRating(name, ratings[name] === n ? 0 : n);
      });
    });
  });
}

function setRating(name, value) {
  ratings[name] = value;
  save();
  renderList();
  renderFavorites();
  if (window.__monBarSubmitRating) window.__monBarSubmitRating(name, value);
  if (document.getElementById("sheet").dataset.current === name) openModal(name);
}

function openModal(name) {
  const x = scoredCocktails().find(x => x.name === name);
  if (!x) return;
  const r = ratings[x.name] || 0;
  document.getElementById("sheet").dataset.current = name;
  document.getElementById("sheet").innerHTML = `
    <div class="sheet-top">
      <h2 class="voice">${x.name}</h2>
      <button class="close-btn" id="close-modal">&times;</button>
    </div>
    <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.glass}</span><span class="tag">${x.base}</span></div>
    <ul class="ing-list">${ingredientListHtml(x)}</ul>
    <div class="steps">${x.steps}</div>
    <div class="stars" data-name="${x.name}">
      ${[1,2,3,4,5].map(n => `<button data-n="${n}">${n <= r ? STAR_FULL : STAR_EMPTY}</button>`).join("")}
    </div>
    ${sharedRatingHtml(x.name)}
    <div class="sheet-actions">
      <button class="share-btn" id="share-btn">Partager la recette</button>
    </div>
  `;
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("share-btn").addEventListener("click", () => shareCocktail(x));
  document.querySelectorAll("#sheet .stars button").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = parseInt(btn.dataset.n, 10);
      setRating(x.name, ratings[x.name] === n ? 0 : n);
    });
  });
  document.getElementById("overlay").classList.add("open");
  const url = new URL(window.location.href);
  url.searchParams.set("cocktail", x.name);
  window.history.replaceState({}, "", url);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("sheet").dataset.current = "";
  const url = new URL(window.location.href);
  url.searchParams.delete("cocktail");
  window.history.replaceState({}, "", url);
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeModal();
});

async function shareCocktail(x) {
  const url = new URL(window.location.href);
  url.searchParams.set("cocktail", x.name);
  const text = `${x.name} — ${x.ingredients.map(i => `${i.qty} ${i.name}`).join(", ")}. ${x.steps}`;
  if (navigator.share) {
    try { await navigator.share({ title: x.name, text, url: url.toString() }); } catch (e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url.toString());
      showToast("Lien copié !");
    } catch (e) { showToast("Impossible de copier le lien"); }
  }
}

document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });
document.getElementById("only-makeable").addEventListener("change", (e) => { onlyMakeable = e.target.checked; renderList(); });
document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Décocher tous les ingrédients de votre bar ?")) {
    owned = new Set();
    save();
    renderCategories();
    renderList();
    renderFavorites();
  }
});

renderCategories();
renderFilters();
renderFavorites();
renderList();

const initialCocktail = new URL(window.location.href).searchParams.get("cocktail");
if (initialCocktail) {
  const match = COCKTAILS.find(x => x.name.toLowerCase() === initialCocktail.toLowerCase());
  if (match) openModal(match.name);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

};
const FIREBASE_ENABLED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("TON_");

if (FIREBASE_ENABLED) {
  import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js").then(async ({ initializeApp }) => {
    const { getFirestore, collection, doc, setDoc, onSnapshot } =
      await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getPseudo() {
      let p = localStorage.getItem("mon-bar-pseudo");
      if (!p) {
        p = prompt("Ton prénom, pour identifier tes notes auprès de tes amis :") || "Anonyme";
        localStorage.setItem("mon-bar-pseudo", p);
      }
      return p;
    }

    window.__monBarSubmitRating = async (name, value) => {
      const pseudo = getPseudo();
      const id = encodeURIComponent(name) + "_" + encodeURIComponent(pseudo);
      try {
        await setDoc(doc(db, "ratings", id), { cocktail: name, pseudo, value, updatedAt: Date.now() });
      } catch (e) { console.error(e); }
    };

    onSnapshot(collection(db, "ratings"), (snap) => {
      const grouped = {};
      snap.forEach((docSnap) => {
        const d = docSnap.data();
        if (!grouped[d.cocktail]) grouped[d.cocktail] = [];
        grouped[d.cocktail].push(d.value);
      });
      sharedRatings = {};
      Object.keys(grouped).forEach((name) => {
        const vals = grouped[name];
        sharedRatings[name] = { avg: vals.reduce((a, b) => a + b, 0) / vals.length, count: vals.length };
      });
      renderList();
      if (document.getElementById("sheet").dataset.current) openModal(document.getElementById("sheet").dataset.current);
    });
  });
}
