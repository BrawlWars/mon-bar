<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon bar">
<meta name="theme-color" content="#17141C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Mon bar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #17141C; color: #EDE6DA; font-family: Georgia, 'Times New Roman', serif; }
  .ui { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 50px); }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #C9A050; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 400; margin: 0 0 6px; line-height: 1.15; }
  .sub { font-size: 13px; color: #9C93A8; margin: 0 0 22px; }
  .reset-btn { font-size: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid #3A3346; background: transparent; color: #B8AFC7; cursor: pointer; white-space: nowrap; }
  .reset-btn:active { background: #211C2B; }
  .fav-section { margin-bottom: 26px; }
  .fav-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .fav-chip { flex-shrink: 0; border: 1px solid #4A3F2A; background: rgba(201,160,80,0.08); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-width: 120px; }
  .fav-chip .fname { font-size: 13px; color: #EDE6DA; margin: 0 0 3px; white-space: nowrap; }
  .fav-chip .fstars { font-size: 11px; color: #C9A050; }
  .cat-label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #9C93A8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { font-size: 13px; padding: 8px 13px; border-radius: 999px; border: 1px solid #3A3346; background: transparent; color: #B8AFC7; cursor: pointer; }
  .chip.on { border-color: #C9A050; background: rgba(201,160,80,0.15); color: #E8C77A; }
  .divider { height: 1px; background: #2A2433; margin: 4px 0 24px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  #search { flex: 1; min-width: 140px; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; outline: none; }
  .filter-lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9C93A8; white-space: nowrap; }
  select { font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; }
  .toolbar2 { display: flex; gap: 8px; margin-bottom: 18px; }
  .toolbar2 select { flex: 1; }
  .card { border: 1px solid #2A2433; background: #1D1926; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .card.ready { border-color: #4A3F2A; background: rgba(201,160,80,0.06); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 17px; font-weight: 400; }
  .status { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #6E647F; white-space: nowrap; }
  .status.ready { color: #E8C77A; }
  .tag-row { display: flex; gap: 6px; margin: 6px 0 10px; }
  .tag { font-size: 10px; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 999px; background: #241F2E; color: #8D839E; }
  .ing-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .ing-list li { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #B8AFC7; border-bottom: 1px solid #241F2E; }
  .ing-list li:last-child { border-bottom: none; }
  .ing-name { display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A050; flex-shrink: 0; }
  .dot.off { background: #4A4155; }
  .ing-qty { color: #8D839E; }
  .steps { font-size: 13px; color: #B8AFC7; margin: 0 0 10px; line-height: 1.5; }
  .stars { display: flex; gap: 4px; }
  .stars button { background: none; border: none; padding: 3px; cursor: pointer; font-size: 15px; }
  .shared-rating { font-size: 12px; color: #8D839E; margin-top: 6px; }
  .empty { text-align: center; color: #6E647F; font-size: 13px; padding: 30px 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #1D1926; border-radius: 20px 20px 0 0; padding: 24px 22px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .sheet-top h2 { margin: 0; font-size: 22px; font-weight: 400; }
  .close-btn { background: none; border: none; color: #8D839E; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .share-btn { font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid #3A3346; background: transparent; color: #E8C77A; cursor: pointer; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2E2740; color: #EDE6DA; font-size: 13px; padding: 10px 16px; border-radius: 8px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .toast.show { opacity: 1; }
  .control-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #9C93A8; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-size: 14px; padding: 9px 10px; border-radius: 8px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; outline: none; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .field textarea { min-height: 70px; resize: vertical; }
  .ing-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .ing-row input { flex: 1; font-size: 13px; padding: 8px 9px; border-radius: 7px; border: 1px solid #3A3346; background: #211C2B; color: #EDE6DA; outline: none; }
  .ing-row input.cf-ing-qty { flex: 0 0 90px; }
  .ing-row button { background: none; border: none; color: #6E647F; font-size: 20px; cursor: pointer; padding: 0 4px; }
  .add-row-btn { font-size: 12px; padding: 7px 10px; border-radius: 7px; border: 1px dashed #3A3346; background: transparent; color: #9C93A8; cursor: pointer; margin-bottom: 14px; }
  .submit-btn { font-size: 14px; padding: 11px 16px; border-radius: 8px; border: none; background: #C9A050; color: #17141C; font-weight: bold; cursor: pointer; width: 100%; }
  .danger-btn { font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid #5A2E2E; background: transparent; color: #D68989; cursor: pointer; }
  .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #241F2E; }
  .lb-row:last-child { border-bottom: none; }
  .lb-name { font-size: 14px; color: #EDE6DA; }
  .lb-top { font-size: 12px; color: #8D839E; margin-top: 2px; }
  .lb-count { font-size: 12px; color: #C9A050; white-space: nowrap; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn { flex: 1; font-size: 13px; padding: 10px; border-radius: 10px; border: 1px solid #3A3346; background: transparent; color: #B8AFC7; cursor: pointer; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .tab-btn.active { border-color: #C9A050; background: rgba(201,160,80,0.12); color: #E8C77A; }
</style>
</head>
<body>
<div class="wrap ui">
  <div class="tab-row">
    <button class="tab-btn active" id="tab-cocktails">🍸 Cocktails</button>
    <button class="tab-btn" id="tab-games">🎲 Jeux</button>
  </div>

  <div id="view-cocktails">
  <div class="head-row">
    <div>
      <div class="eyebrow">Mon bar</div>
      <h1 class="voice">Ce que vous pouvez servir ce soir</h1>
    </div>
  </div>
  <p class="sub" id="count-line"></p>

  <div class="control-row">
    <button class="reset-btn" id="add-btn">+ Cocktail perso</button>
    <button class="reset-btn" id="leaderboard-btn">Classement amis</button>
    <button class="reset-btn" id="reset-btn">Réinitialiser mon bar</button>
  </div>

  <div class="fav-section" id="fav-section" style="display:none">
    <div class="cat-label">Vos favoris</div>
    <div class="fav-scroll" id="fav-scroll"></div>
  </div>

  <div id="categories"></div>

  <div class="divider"></div>

  <div class="toolbar">
    <input id="search" placeholder="Chercher un cocktail">
    <label class="filter-lbl"><input type="checkbox" id="only-makeable"> Réalisables</label>
  </div>
  <div class="toolbar2">
    <select id="filter-category"></select>
    <select id="filter-base"></select>
  </div>

  <div id="list"></div>
  </div>

  <div id="view-games" style="display:none">
    <div class="eyebrow">Mon bar</div>
    <h1 class="voice">Jeux à boire</h1>
    <p class="sub" id="games-count-line"></p>
    <div class="control-row">
      <button class="reset-btn" id="add-game-btn">+ Jeu perso</button>
    </div>
    <div class="chips" id="game-cat-chips"></div>
    <div class="toolbar">
      <input id="game-search" placeholder="Chercher un jeu">
    </div>
    <div id="games-list"></div>
  </div>
</div>

<div class="overlay ui" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast ui" id="toast"></div>
<datalist id="ingredient-options"></datalist>

<script type="module">

  c("Bloody Mary","Verre long","Vodka","Classique",[ing("Vodka","4,5 cl"),ing("Jus de tomate","9 cl"),ing("Jus de citron","1,5 cl"),ing("Sauce Worcestershire","2 traits"),ing("Tabasco","2 traits")],"Mélanger tous les ingrédients sur glace, saler, poivrer, garnir d'une branche de céleri."),

    ["2 dés", "Une feuille et un stylo pour tracer une piste (ou 6 verres alignés)", "Des jetons ou de la petite monnaie pour les mises", "Boissons"],
    "Tracez une piste numérotée de 1 à 6 avec une ligne de départ et d'arrivée. Chaque joueur mise sur un numéro de cheval. À tour de rôle, lancez les deux dés : le cheval correspondant à la somme avance d'une case. Le propriétaire du dernier cheval à franchir la ligne d'arrivée boit une pénalité, ou le gagnant distribue des gorgées aux perdants selon la règle choisie en début de partie."),
  g("Mistigri", "Cartes", "3 joueurs et plus",
    ["Jeu de 52 cartes duquel on retire une Dame, pour qu'il en reste une seule non appariée", "Boissons"],
    "Distribuez toutes les cartes. Chaque joueur écarte immédiatement les paires qu'il a en main. À tour de rôle, chacun pioche une carte au hasard dans la main de son voisin de gauche et écarte les nouvelles paires formées. Le jeu continue jusqu'à ce qu'il ne reste qu'une seule carte, la Dame solitaire. Le joueur qui la détient à la fin boit une pénalité.")
];
const GAME_CATEGORY_OPTIONS = ["Tous","Cartes","Dés","Adresse","Ambiance"];

const STAR_FULL = "★", STAR_EMPTY = "☆";
let owned = new Set(JSON.parse(localStorage.getItem("mon-bar-inventory") || "[]"));
let ratings = JSON.parse(localStorage.getItem("mon-bar-ratings") || "{}");
let customCocktails = JSON.parse(localStorage.getItem("mon-bar-custom") || "[]");
let sharedCustomCocktails = [];
let sharedRatings = {};
let allRatingsRaw = [];
let query = "";
let onlyMakeable = false;
let filterCategory = "Tous";
let filterBase = "Tous";
let formIngredients = [{ name: "", qty: "" }];
let gameQuery = "";
let gameFilterCategory = "Tous";
let customGames = JSON.parse(localStorage.getItem("mon-bar-custom-games") || "[]");
let sharedCustomGames = [];
let formGameItems = [""];

function allGames() { return FIREBASE_ENABLED ? [...GAMES, ...sharedCustomGames] : [...GAMES, ...customGames]; }

function allCocktails() { return FIREBASE_ENABLED ? [...COCKTAILS, ...sharedCustomCocktails] : [...COCKTAILS, ...customCocktails]; }
function extraIngredients() {
  const known = new Set(CATEGORIES.flatMap(c => c.items));
  return Array.from(new Set(allCocktails().filter(x => x.custom).flatMap(x => x.ingredients.map(i => i.name))))
    .filter(n => !known.has(n))
    .sort((a, b) => a.localeCompare(b));
}
function allKnownIngredients() { return [...CATEGORIES.flatMap(cat => cat.items), ...extraIngredients()]; }

function save() {
  localStorage.setItem("mon-bar-inventory", JSON.stringify([...owned]));
  localStorage.setItem("mon-bar-ratings", JSON.stringify(ratings));
}

function saveCustom() {
  localStorage.setItem("mon-bar-custom", JSON.stringify(customCocktails));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function renderCategories() {
  const el = document.getElementById("categories");
  let html = CATEGORIES.map(cat => `
    <div class="cat-label">${cat.name}</div>
    <div class="chips">
      ${cat.items.map(item => `<button class="chip ${owned.has(item) ? "on" : ""}" data-item="${item}">${owned.has(item) ? "✓ " : ""}${item}</button>`).join("")}
    </div>
  `).join("");
  const extra = extraIngredients();
  if (extra.length) {
    html += `
      <div class="cat-label">Autres (perso)</div>
      <div class="chips">
        ${extra.map(item => `<button class="chip ${owned.has(item) ? "on" : ""}" data-item="${item}">${owned.has(item) ? "✓ " : ""}${item}</button>`).join("")}
      </div>
    `;
  }
  el.innerHTML = html;
  document.getElementById("ingredient-options").innerHTML =
    allKnownIngredients().map(i => `<option value="${i}"></option>`).join("");
  el.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = btn.dataset.item;
      owned.has(item) ? owned.delete(item) : owned.add(item);
      save();
      renderCategories();
      renderList();
      renderFavorites();
    });
  });
}

function scoredCocktails() {
  return allCocktails().map(x => {
    const missing = x.ingredients.filter(i => !owned.has(i.name));
    return { ...x, missing, makeable: missing.length === 0 };
  });
}

function filteredCocktails() {
  return scoredCocktails()
    .filter(x => onlyMakeable ? x.makeable : true)
    .filter(x => x.name.toLowerCase().includes(query.toLowerCase()))
    .filter(x => filterCategory === "Tous" ? true : x.category === filterCategory)
    .filter(x => filterBase === "Tous" ? true : x.base === filterBase)
    .sort((a, b) => a.missing.length - b.missing.length || a.name.localeCompare(b.name));
}

function renderFilters() {
  const catSel = document.getElementById("filter-category");
  const baseSel = document.getElementById("filter-base");
  const baseOptions = ["Tous", ...Array.from(new Set(allCocktails().map(x => x.base))).sort((a, b) => a.localeCompare(b))];
  const prevCat = catSel.value || filterCategory;
  const prevBase = baseSel.value || filterBase;
  catSel.innerHTML = CATEGORY_OPTIONS.map(o => `<option value="${o}">${o === "Tous" ? "Toutes catégories" : o}</option>`).join("");
  baseSel.innerHTML = baseOptions.map(o => `<option value="${o}">${o === "Tous" ? "Toutes bases" : o}</option>`).join("");
  if (baseOptions.includes(prevBase)) baseSel.value = prevBase;
  catSel.value = prevCat;
  catSel.onchange = () => { filterCategory = catSel.value; renderList(); };
  baseSel.onchange = () => { filterBase = baseSel.value; renderList(); };
}

function renderFavorites() {
  const favs = scoredCocktails()
    .filter(x => (ratings[x.name] || 0) >= 4)
    .sort((a, b) => (ratings[b.name] || 0) - (ratings[a.name] || 0))
    .slice(0, 5);
  const section = document.getElementById("fav-section");
  if (favs.length === 0) { section.style.display = "none"; return; }
  section.style.display = "block";
  document.getElementById("fav-scroll").innerHTML = favs.map(x => `
    <div class="fav-chip" data-open="${x.name}">
      <p class="fname">${x.name}</p>
      <p class="fstars">${STAR_FULL.repeat(ratings[x.name] || 0)}${STAR_EMPTY.repeat(5 - (ratings[x.name] || 0))}</p>
    </div>
  `).join("");
  document.getElementById("fav-scroll").querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => openModal(el.dataset.open));
  });
}

function ingredientListHtml(x) {
  return x.ingredients.map(i => {
    const isMissing = !owned.has(i.name);
    return `<li class="${isMissing ? "miss" : ""}">
      <span class="ing-name"><span class="dot ${isMissing ? "off" : ""}"></span>${i.name}</span>
      <span class="ing-qty">${i.qty}</span>
    </li>`;
  }).join("");
}

function sharedRatingHtml(name) {
  const s = sharedRatings[name];
  if (!s || s.count === 0) return "";
  return `<div class="shared-rating">Note des amis : ${s.avg.toFixed(1)} ★ (${s.count} avis)</div>`;
}

function renderList() {
  const scored = filteredCocktails();
  const all = allCocktails();
  const makeableCount = all.filter(x => x.ingredients.every(i => owned.has(i.name))).length;
  document.getElementById("count-line").textContent =
    `${makeableCount} cocktail${makeableCount !== 1 ? "s" : ""} réalisable${makeableCount !== 1 ? "s" : ""} sur ${all.length}, avec votre bar actuel`;

  const list = document.getElementById("list");
  if (scored.length === 0) {
    list.innerHTML = `<div class="empty">Aucun cocktail ne correspond.</div>`;
    return;
  }
  list.innerHTML = scored.map(x => {
    const r = ratings[x.name] || 0;
    return `
    <div class="card ${x.makeable ? "ready" : ""}" data-open="${x.name}">
      <div class="card-head">
        <h3 class="voice">${x.name}</h3>
        <span class="status ${x.makeable ? "ready" : ""}">${x.makeable ? "Prêt" : x.missing.length === 1 ? "1 ingrédient manquant" : x.missing.length + " ingrédients manquants"}</span>
      </div>
      <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.glass}</span>${x.custom ? '<span class="tag">Fait maison</span>' : ""}${x.addedBy ? `<span class="tag">Par ${x.addedBy}</span>` : ""}</div>
      <ul class="ing-list">${ingredientListHtml(x)}</ul>
      <div class="steps">${x.steps}</div>
      <div class="stars" data-name="${x.name}">
        ${[1,2,3,4,5].map(n => `<button data-n="${n}">${n <= r ? STAR_FULL : STAR_EMPTY}</button>`).join("")}
      </div>
      ${sharedRatingHtml(x.name)}
    </div>`;
  }).join("");

  list.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.closest(".stars")) return;
      openModal(card.dataset.open);
    });
  });
  list.querySelectorAll(".stars").forEach(starsEl => {
    const name = starsEl.dataset.name;
    starsEl.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = parseInt(btn.dataset.n, 10);
        setRating(name, ratings[name] === n ? 0 : n);
      });
    });
  });
}

function setRating(name, value) {
  ratings[name] = value;
  save();
  renderList();
  renderFavorites();
  if (window.__monBarSubmitRating) window.__monBarSubmitRating(name, value);
  if (document.getElementById("sheet").dataset.current === name) openModal(name);
}

function openModal(name) {
  const x = scoredCocktails().find(x => x.name === name);
  if (!x) return;
  const r = ratings[x.name] || 0;
  const sheet = document.getElementById("sheet");
  sheet.dataset.mode = "cocktail";
  sheet.dataset.current = name;
  sheet.innerHTML = `
    <div class="sheet-top">
      <h2 class="voice">${x.name}</h2>
      <button class="close-btn" id="close-modal">&times;</button>
    </div>
    <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.glass}</span><span class="tag">${x.base}</span>${x.custom ? '<span class="tag">Fait maison</span>' : ""}${x.addedBy ? `<span class="tag">Par ${x.addedBy}</span>` : ""}</div>
    <ul class="ing-list">${ingredientListHtml(x)}</ul>
    <div class="steps">${x.steps}</div>
    <div class="stars" data-name="${x.name}">
      ${[1,2,3,4,5].map(n => `<button data-n="${n}">${n <= r ? STAR_FULL : STAR_EMPTY}</button>`).join("")}
    </div>
    ${sharedRatingHtml(x.name)}
    <div class="sheet-actions">
      <button class="share-btn" id="share-btn">Partager la recette</button>
      ${x.custom ? '<button class="danger-btn" id="delete-btn">Supprimer</button>' : ""}
    </div>
  `;
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("share-btn").addEventListener("click", () => shareCocktail(x));
  const deleteBtn = document.getElementById("delete-btn");
  if (deleteBtn) deleteBtn.addEventListener("click", () => deleteCustomCocktail(x.name));
  document.querySelectorAll("#sheet .stars button").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = parseInt(btn.dataset.n, 10);
      setRating(x.name, ratings[x.name] === n ? 0 : n);
    });
  });
  document.getElementById("overlay").classList.add("open");
  const url = new URL(window.location.href);
  url.searchParams.set("cocktail", x.name);
  window.history.replaceState({}, "", url);
}

function deleteCustomCocktail(name) {
  if (!confirm("Supprimer ce cocktail personnalisé ?")) return;
  if (FIREBASE_ENABLED) {
    const x = sharedCustomCocktails.find(c => c.name === name);
    if (x && window.__monBarDeleteCustomCocktail) window.__monBarDeleteCustomCocktail(x.id);
  } else {
    customCocktails = customCocktails.filter(x => x.name !== name);
    saveCustom();
  }
  closeModal();
  renderCategories();
  renderFilters();
  renderList();
  renderFavorites();
  showToast("Cocktail supprimé");
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  const sheet = document.getElementById("sheet");
  sheet.dataset.current = "";
  sheet.dataset.mode = "";
  const url = new URL(window.location.href);
  url.searchParams.delete("cocktail");
  url.searchParams.delete("game");
  window.history.replaceState({}, "", url);
}

function openAddCocktailForm() {
  formIngredients = [{ name: "", qty: "" }];
  const sheet = document.getElementById("sheet");
  sheet.dataset.mode = "add-form";
  sheet.dataset.current = "";
  sheet.innerHTML = `
    <div class="sheet-top">
      <h2 class="voice">Ajouter un cocktail</h2>
      <button class="close-btn" id="close-modal">&times;</button>
    </div>
    <div class="field">
      <label>Nom du cocktail</label>
      <input id="cf-name" placeholder="Ex. Spritz maison">
    </div>
    <div class="field">
      <label>Verre</label>
      <input id="cf-glass" placeholder="Ex. Verre ballon">
    </div>
    <div class="field">
      <label>Catégorie</label>
      <select id="cf-category">
        ${CATEGORY_OPTIONS.filter(o => o !== "Tous").map(o => `<option value="${o}">${o}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <label>Ingrédients</label>
      <div id="cf-ingredients"></div>
      <button class="add-row-btn" id="cf-add-row">+ Ajouter un ingrédient</button>
    </div>
    <div class="field">
      <label>Étapes de préparation</label>
      <textarea id="cf-steps" placeholder="Ex. Verser sur glace, mélanger, garnir..."></textarea>
    </div>
    <button class="submit-btn" id="cf-submit">Ajouter à ma base</button>
  `;
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("cf-add-row").addEventListener("click", () => {
    formIngredients.push({ name: "", qty: "" });
    renderFormIngredientRows();
  });
  document.getElementById("cf-submit").addEventListener("click", submitCustomCocktail);
  renderFormIngredientRows();
  document.getElementById("overlay").classList.add("open");
}

function renderFormIngredientRows() {
  const container = document.getElementById("cf-ingredients");
  if (!container) return;
  container.innerHTML = formIngredients.map((row, idx) => `
    <div class="ing-row" data-idx="${idx}">
      <input class="cf-ing-name" list="ingredient-options" placeholder="Ingrédient" value="${(row.name || "").replace(/"/g, "&quot;")}">
      <input class="cf-ing-qty" placeholder="Quantité" value="${(row.qty || "").replace(/"/g, "&quot;")}">
      <button class="cf-ing-remove" title="Retirer">&times;</button>
    </div>
  `).join("");
  container.querySelectorAll(".ing-row").forEach(rowEl => {
    const idx = parseInt(rowEl.dataset.idx, 10);
    rowEl.querySelector(".cf-ing-name").addEventListener("input", e => { formIngredients[idx].name = e.target.value; });
    rowEl.querySelector(".cf-ing-qty").addEventListener("input", e => { formIngredients[idx].qty = e.target.value; });
    rowEl.querySelector(".cf-ing-remove").addEventListener("click", () => {
      formIngredients.splice(idx, 1);
      if (formIngredients.length === 0) formIngredients.push({ name: "", qty: "" });
      renderFormIngredientRows();
    });
  });
}

function submitCustomCocktail() {
  const name = document.getElementById("cf-name").value.trim();
  const glass = document.getElementById("cf-glass").value.trim() || "Verre au choix";
  const category = document.getElementById("cf-category").value;
  const steps = document.getElementById("cf-steps").value.trim() || "Mélanger les ingrédients selon vos goûts.";
  const ingredients = formIngredients
    .filter(i => (i.name || "").trim())
    .map(i => ({ name: i.name.trim(), qty: (i.qty || "").trim() || "—" }));

  if (!name || ingredients.length === 0) {
    showToast("Nom et au moins un ingrédient requis");
    return;
  }
  if (allCocktails().some(x => x.name.toLowerCase() === name.toLowerCase())) {
    showToast("Un cocktail porte déjà ce nom");
    return;
  }

  const base = ingredients[0].name;
  const newCocktail = { name, glass, base, category, ingredients, steps, custom: true };

  if (FIREBASE_ENABLED && window.__monBarAddCustomCocktail) {
    window.__monBarAddCustomCocktail(newCocktail);
  } else {
    customCocktails.push(newCocktail);
    saveCustom();
  }

  closeModal();
  renderCategories();
  renderFilters();
  renderList();
  renderFavorites();
  showToast(FIREBASE_ENABLED ? "Cocktail ajouté et partagé avec vos amis !" : "Cocktail ajouté !");
}

function openLeaderboard() {
  const sheet = document.getElementById("sheet");
  sheet.dataset.mode = "leaderboard";
  sheet.dataset.current = "";
  if (!FIREBASE_ENABLED) {
    sheet.innerHTML = `
      <div class="sheet-top">
        <h2 class="voice">Classement amis</h2>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <p class="steps">Le classement partagé nécessite Firebase Firestore, qui n'est pas encore configuré dans l'app. Une fois vos clés ajoutées dans firebaseConfig, cette section affichera automatiquement qui a noté quoi.</p>
    `;
  } else {
    const byPseudo = {};
    allRatingsRaw.forEach(d => { (byPseudo[d.pseudo] = byPseudo[d.pseudo] || []).push(d); });
    const rows = Object.entries(byPseudo)
      .map(([pseudo, list]) => {
        const top = [...list].sort((a, b) => b.value - a.value)[0];
        return { pseudo, count: list.length, top };
      })
      .sort((a, b) => b.count - a.count);
    sheet.innerHTML = `
      <div class="sheet-top">
        <h2 class="voice">Classement amis</h2>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      ${rows.length === 0
        ? '<p class="steps">Aucun avis partagé pour le moment.</p>'
        : rows.map(r => `
          <div class="lb-row">
            <div>
              <div class="lb-name">${r.pseudo}</div>
              <div class="lb-top">Coup de cœur : ${r.top.cocktail} (${r.top.value}★)</div>
            </div>
            <div class="lb-count">${r.count} avis</div>
          </div>
        `).join("")
      }
    `;
  }
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("overlay").classList.add("open");
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeModal();
});

async function shareCocktail(x) {
  const url = new URL(window.location.href);
  url.searchParams.set("cocktail", x.name);
  const text = `${x.name} — ${x.ingredients.map(i => `${i.qty} ${i.name}`).join(", ")}. ${x.steps}`;
  if (navigator.share) {
    try { await navigator.share({ title: x.name, text, url: url.toString() }); } catch (e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url.toString());
      showToast("Lien copié !");
    } catch (e) { showToast("Impossible de copier le lien"); }
  }
}

document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });
document.getElementById("only-makeable").addEventListener("change", (e) => { onlyMakeable = e.target.checked; renderList(); });
document.getElementById("add-btn").addEventListener("click", openAddCocktailForm);
document.getElementById("leaderboard-btn").addEventListener("click", openLeaderboard);
document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Décocher tous les ingrédients de votre bar ?")) {
    owned = new Set();
    save();
    renderCategories();
    renderList();
    renderFavorites();
  }
});

function renderGameFilters() {
  const el = document.getElementById("game-cat-chips");
  el.innerHTML = GAME_CATEGORY_OPTIONS.map(o => `<button class="chip ${gameFilterCategory === o ? "on" : ""}" data-cat="${o}">${o}</button>`).join("");
  el.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      gameFilterCategory = btn.dataset.cat;
      renderGameFilters();
      renderGamesList();
    });
  });
}

function filteredGames() {
  return allGames()
    .filter(x => gameFilterCategory === "Tous" ? true : x.category === gameFilterCategory)
    .filter(x => x.name.toLowerCase().includes(gameQuery.toLowerCase()));
}

function renderGamesList() {
  const list = filteredGames();
  document.getElementById("games-count-line").textContent = `${list.length} jeu${list.length !== 1 ? "x" : ""} sur ${allGames().length} dans la bibliothèque`;
  const el = document.getElementById("games-list");
  if (list.length === 0) {
    el.innerHTML = `<div class="empty">Aucun jeu ne correspond.</div>`;
    return;
  }
  el.innerHTML = list.map(x => `
    <div class="card" data-open-game="${x.name}">
      <div class="card-head"><h3 class="voice">${x.name}</h3></div>
      <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.players}</span>${x.custom ? '<span class="tag">Fait maison</span>' : ""}${x.addedBy ? `<span class="tag">Par ${x.addedBy}</span>` : ""}</div>
      <div class="steps">${x.items.length} objet${x.items.length !== 1 ? "s" : ""} requis${x.items.length === 0 ? " (aucun matériel)" : ""}</div>
    </div>
  `).join("");
  el.querySelectorAll("[data-open-game]").forEach(card => {
    card.addEventListener("click", () => openGameModal(card.dataset.openGame));
  });
}

function openGameModal(name) {
  const x = allGames().find(x => x.name === name);
  if (!x) return;
  const sheet = document.getElementById("sheet");
  sheet.dataset.mode = "game";
  sheet.dataset.current = name;
  sheet.innerHTML = `
    <div class="sheet-top">
      <h2 class="voice">${x.name}</h2>
      <button class="close-btn" id="close-modal">&times;</button>
    </div>
    <div class="tag-row"><span class="tag">${x.category}</span><span class="tag">${x.players}</span>${x.custom ? '<span class="tag">Fait maison</span>' : ""}${x.addedBy ? `<span class="tag">Par ${x.addedBy}</span>` : ""}</div>
    <div class="cat-label">Objets requis</div>
    <ul class="ing-list">${x.items.length ? x.items.map(i => `<li><span class="ing-name"><span class="dot"></span>${i}</span></li>`).join("") : "<li>Aucun matériel particulier</li>"}</ul>
    <div class="cat-label">Fonctionnement du jeu</div>
    <div class="steps">${x.rules}</div>
    <div class="sheet-actions">
      <button class="share-btn" id="share-btn">Partager le jeu</button>
      ${x.custom ? '<button class="danger-btn" id="delete-game-btn">Supprimer</button>' : ""}
    </div>
  `;
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("share-btn").addEventListener("click", () => shareGame(x));
  const deleteBtn = document.getElementById("delete-game-btn");
  if (deleteBtn) deleteBtn.addEventListener("click", () => deleteCustomGame(x.name));
  document.getElementById("overlay").classList.add("open");
  const url = new URL(window.location.href);
  url.searchParams.set("game", x.name);
  window.history.replaceState({}, "", url);
}

function deleteCustomGame(name) {
  if (!confirm("Supprimer ce jeu personnalisé ?")) return;
  if (FIREBASE_ENABLED) {
    const x = sharedCustomGames.find(g => g.name === name);
    if (x && window.__monBarDeleteCustomGame) window.__monBarDeleteCustomGame(x.id);
  } else {
    customGames = customGames.filter(x => x.name !== name);
    localStorage.setItem("mon-bar-custom-games", JSON.stringify(customGames));
  }
  closeModal();
  renderGamesList();
  showToast("Jeu supprimé");
}

function openAddGameForm() {
  formGameItems = [""];
  const sheet = document.getElementById("sheet");
  sheet.dataset.mode = "add-game-form";
  sheet.dataset.current = "";
  sheet.innerHTML = `
    <div class="sheet-top">
      <h2 class="voice">Ajouter un jeu</h2>
      <button class="close-btn" id="close-modal">&times;</button>
    </div>
    <div class="field">
      <label>Nom du jeu</label>
      <input id="gf-name" placeholder="Ex. Puissance 4 buvable">
    </div>
    <div class="field">
      <label>Type</label>
      <select id="gf-category">
        ${GAME_CATEGORY_OPTIONS.filter(o => o !== "Tous").map(o => `<option value="${o}">${o}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <label>Nombre de joueurs</label>
      <input id="gf-players" placeholder="Ex. 4 joueurs et plus">
    </div>
    <div class="field">
      <label>Objets requis</label>
      <div id="gf-items"></div>
      <button class="add-row-btn" id="gf-add-row">+ Ajouter un objet</button>
    </div>
    <div class="field">
      <label>Fonctionnement du jeu</label>
      <textarea id="gf-rules" placeholder="Expliquez les règles étape par étape..."></textarea>
    </div>
    <button class="submit-btn" id="gf-submit">Ajouter à ma bibliothèque</button>
  `;
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("gf-add-row").addEventListener("click", () => {
    formGameItems.push("");
    renderFormGameItemRows();
  });
  document.getElementById("gf-submit").addEventListener("click", submitCustomGame);
  renderFormGameItemRows();
  document.getElementById("overlay").classList.add("open");
}

function renderFormGameItemRows() {
  const container = document.getElementById("gf-items");
  if (!container) return;
  container.innerHTML = formGameItems.map((val, idx) => `
    <div class="ing-row" data-idx="${idx}">
      <input class="gf-item-name" placeholder="Ex. Jeu de 52 cartes" value="${(val || "").replace(/"/g, "&quot;")}">
      <button class="gf-item-remove" title="Retirer">&times;</button>
    </div>
  `).join("");
  container.querySelectorAll(".ing-row").forEach(rowEl => {
    const idx = parseInt(rowEl.dataset.idx, 10);
    rowEl.querySelector(".gf-item-name").addEventListener("input", e => { formGameItems[idx] = e.target.value; });
    rowEl.querySelector(".gf-item-remove").addEventListener("click", () => {
      formGameItems.splice(idx, 1);
      if (formGameItems.length === 0) formGameItems.push("");
      renderFormGameItemRows();
    });
  });
}

function submitCustomGame() {
  const name = document.getElementById("gf-name").value.trim();
  const category = document.getElementById("gf-category").value;
  const players = document.getElementById("gf-players").value.trim() || "Groupe libre";
  const rules = document.getElementById("gf-rules").value.trim();
  const items = formGameItems.map(i => i.trim()).filter(Boolean);

  if (!name || !rules) {
    showToast("Nom et règles du jeu requis");
    return;
  }
  if (allGames().some(x => x.name.toLowerCase() === name.toLowerCase())) {
    showToast("Un jeu porte déjà ce nom");
    return;
  }

  const newGame = { name, category, players, items, rules, custom: true };

  if (FIREBASE_ENABLED && window.__monBarAddCustomGame) {
    window.__monBarAddCustomGame(newGame);
  } else {
    customGames.push(newGame);
    localStorage.setItem("mon-bar-custom-games", JSON.stringify(customGames));
  }

  closeModal();
  renderGamesList();
  showToast(FIREBASE_ENABLED ? "Jeu ajouté et partagé avec vos amis !" : "Jeu ajouté !");
}

async function shareGame(x) {
  const url = new URL(window.location.href);
  url.searchParams.set("game", x.name);
  const text = `${x.name} — Objets requis : ${x.items.join(", ") || "aucun"}. ${x.rules}`;
  if (navigator.share) {
    try { await navigator.share({ title: x.name, text, url: url.toString() }); } catch (e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url.toString());
      showToast("Lien copié !");
    } catch (e) { showToast("Impossible de copier le lien"); }
  }
}

function showView(view) {
  document.getElementById("view-cocktails").style.display = view === "cocktails" ? "block" : "none";
  document.getElementById("view-games").style.display = view === "games" ? "block" : "none";
  document.getElementById("tab-cocktails").classList.toggle("active", view === "cocktails");
  document.getElementById("tab-games").classList.toggle("active", view === "games");
  localStorage.setItem("mon-bar-view", view);
}
document.getElementById("tab-cocktails").addEventListener("click", () => showView("cocktails"));
document.getElementById("tab-games").addEventListener("click", () => showView("games"));
document.getElementById("game-search").addEventListener("input", (e) => { gameQuery = e.target.value; renderGamesList(); });
document.getElementById("add-game-btn").addEventListener("click", openAddGameForm);

renderCategories();
renderFilters();
renderFavorites();
renderList();
renderGameFilters();
renderGamesList();

const initParams = new URL(window.location.href).searchParams;
const initialCocktail = initParams.get("cocktail");
const initialGame = initParams.get("game");
const savedView = localStorage.getItem("mon-bar-view") || "cocktails";
if (initialGame) {
  showView("games");
  const match = GAMES.find(x => x.name.toLowerCase() === initialGame.toLowerCase()) || customGames.find(x => x.name.toLowerCase() === initialGame.toLowerCase());
  if (match) openGameModal(match.name);
} else if (initialCocktail) {
  showView("cocktails");
  const match = COCKTAILS.find(x => x.name.toLowerCase() === initialCocktail.toLowerCase());
  if (match) openModal(match.name);
} else {
  showView(savedView);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

if (FIREBASE_ENABLED) {
  import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js").then(async ({ initializeApp }) => {
    const { getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot } =
      await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getPseudo() {
      let p = localStorage.getItem("mon-bar-pseudo");
      if (!p) {
        p = prompt("Ton prénom, pour identifier tes notes auprès de tes amis :") || "Anonyme";
        localStorage.setItem("mon-bar-pseudo", p);
      }
      return p;
    }

    window.__monBarSubmitRating = async (name, value) => {
      const pseudo = getPseudo();
      const id = encodeURIComponent(name) + "_" + encodeURIComponent(pseudo);
      try {
        await setDoc(doc(db, "ratings", id), { cocktail: name, pseudo, value, updatedAt: Date.now() });
      } catch (e) { console.error(e); }
    };

    onSnapshot(collection(db, "ratings"), (snap) => {
      allRatingsRaw = snap.docs.map(d => d.data());
      const grouped = {};
      allRatingsRaw.forEach((d) => {
        if (!grouped[d.cocktail]) grouped[d.cocktail] = [];
        grouped[d.cocktail].push(d.value);
      });
      sharedRatings = {};
      Object.keys(grouped).forEach((name) => {
        const vals = grouped[name];
        sharedRatings[name] = { avg: vals.reduce((a, b) => a + b, 0) / vals.length, count: vals.length };
      });
      renderList();
      const sheet = document.getElementById("sheet");
      if (sheet.dataset.mode === "cocktail" && sheet.dataset.current) openModal(sheet.dataset.current);
      else if (sheet.dataset.mode === "leaderboard") openLeaderboard();
    });

    window.__monBarAddCustomCocktail = async (cocktail) => {
      const pseudo = getPseudo();
      try {
        await addDoc(collection(db, "customCocktails"), { ...cocktail, addedBy: pseudo, createdAt: Date.now() });
      } catch (e) { console.error(e); showToast("Erreur d'envoi, réessaie."); }
    };

    window.__monBarDeleteCustomCocktail = async (id) => {
      try { await deleteDoc(doc(db, "customCocktails", id)); } catch (e) { console.error(e); }
    };

    onSnapshot(collection(db, "customCocktails"), (snap) => {
      sharedCustomCocktails = snap.docs.map(d => ({ id: d.id, ...d.data(), custom: true }));
      renderCategories();
      renderFilters();
      renderList();
      renderFavorites();
      const sheet = document.getElementById("sheet");
      if (sheet.dataset.mode === "cocktail" && sheet.dataset.current) openModal(sheet.dataset.current);
    });

    window.__monBarAddCustomGame = async (game) => {
      const pseudo = getPseudo();
      try {
        await addDoc(collection(db, "customGames"), { ...game, addedBy: pseudo, createdAt: Date.now() });
      } catch (e) { console.error(e); showToast("Erreur d'envoi, réessaie."); }
    };

    window.__monBarDeleteCustomGame = async (id) => {
      try { await deleteDoc(doc(db, "customGames", id)); } catch (e) { console.error(e); }
    };

    onSnapshot(collection(db, "customGames"), (snap) => {
      sharedCustomGames = snap.docs.map(d => ({ id: d.id, ...d.data(), custom: true }));
      renderGamesList();
      const sheet = document.getElementById("sheet");
      if (sheet.dataset.mode === "game" && sheet.dataset.current) openGameModal(sheet.dataset.current);
    });
  });
}
</script>
</body>
</html>
